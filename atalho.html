<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Dona Léia · Pesagem</title>
<meta name="theme-color" content="#2a1c12">
<link rel="icon" type="image/png" href="icone-192.png">
<link rel="apple-touch-icon" href="icone-192.png">
<style>
  html, body { margin: 0; height: 100%; background: #1d130c; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #c4ab8d; font: 16px system-ui, "Segoe UI", Roboto, sans-serif; gap: 14px; }
  #carregando img { width: 96px; height: 96px; border-radius: 18px; }
</style>
</head>
<body>
<!-- Versão "atalho" da casca: sem manifest, para celulares em que o app instalado fecha sozinho. Abre no Chrome, com o ícone do Dona Léia. -->
<div id="carregando"><img src="icone-192.png" alt=""><span>Abrindo…</span></div>
<iframe id="app" title="Dona Léia · Pesagem"
  src="https://script.google.com/macros/s/AKfycbzx3qLl3MO3kXk2LvPwC-4NRPhGzOFVACOXechoFYNA5h6Ppo-Clw22dFXDJfXYuTwCng/exec"
  allow="clipboard-write"></iframe>
<script>
  document.getElementById("app").addEventListener("load", function () {
    var c = document.getElementById("carregando"); if (c) c.remove();
  });
</script>
</body>
</html>
